name: Internal release checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,scipy]' build
      - run: python scripts/build_help.py --check
      - run: python -m pytest -q
      - run: python -m build
      - run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/verify_release.py --wheel "dist/mipframe-${VERSION}-py3-none-any.whl" --sdist "dist/mipframe-${VERSION}.tar.gz"
