[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpir"
version = "0.5.2"
description = "Exact, verifiable analysis and query infrastructure for LP and MPS models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
probe = ["scipy>=1.11"]
graph = ["igraph>=0.11"]

[project.scripts]
lpir = "lpir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
